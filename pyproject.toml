[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docstring-generator-cli"
version = "0.1.0"
description = "Find Python functions missing docstrings and fill them with a fine-tuned LoRA model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryaan Khawaja" }]
keywords = ["docstring", "documentation", "llm", "lora", "gguf", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
# ast.FunctionDef | ast.AsyncFunctionDef in docgen/astutils.py is a runtime
# PEP-604 union evaluated at import, so 3.9 raises TypeError on import.
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "libcst>=1.1",
    # PyPI has only an sdist (needs a C++ toolchain); the README install line
    # adds llama-cpp-python's prebuilt-wheel index.
    "llama-cpp-python>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/brownricee/docstring-generator-cli"
Issues = "https://github.com/brownricee/docstring-generator-cli/issues"

[project.scripts]
docgen = "docgen.cli:app"

# An explicit allowlist, not auto-discovery: training/, data/ (23 MB of
# committed JSONL) and checkpoints/ must never reach the wheel.
[tool.hatch.build.targets.wheel]
packages = ["docgen"]

# hatchling's default sdist is "everything git doesn't ignore", which would
# ship data/*.jsonl. Name the contents instead.
[tool.hatch.build.targets.sdist]
include = ["docgen", "pyproject.toml", "README.md", "LICENSE"]
